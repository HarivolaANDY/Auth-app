<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="auth-bg">
    <div class="auth-ambient-glow" aria-hidden="true"></div>
    <div class="auth-ambient-glow-bottom" aria-hidden="true"></div>

    <div class="auth-container">
        <div class="auth-card text-center py-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-indigo-50 text-indigo-600 border border-indigo-100 mb-4 shadow-sm">
                <span class="text-2xl font-black tracking-tight">404</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Page Not Found</h1>
            <p class="text-sm text-slate-500 mb-8 max-w-xs mx-auto">
                The requested URL was not found on this server. Please check the address or return to the application.
            </p>
            <a href="/index.html" class="btn-primary max-w-xs mx-auto text-decoration-none">
                <span>Back to Sign In</span>
            </a>
        </div>
    </div>
</body>
</html>
